<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WordQuest - Login</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔤</text></svg>"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/scenes.css"/>
</head>
<body class="auth-page">

  <!-- ── LEFT PANEL: Animated Mountain Sunset Scene ── -->
  <div class="auth-scene-panel">
    <div class="scene scene-login" id="loginScene">

      <!-- Stars -->
      <div class="login-stars" id="loginStars"></div>

      <!-- Moon -->
      <div class="login-moon"></div>

      <!-- Clouds -->
      <div class="login-cloud" style="top:12%;width:180px;height:40px;animation-duration:28s;animation-delay:0s;"></div>
      <div class="login-cloud" style="top:20%;width:120px;height:28px;animation-duration:22s;animation-delay:-8s;"></div>
      <div class="login-cloud" style="top:28%;width:200px;height:35px;animation-duration:35s;animation-delay:-15s;"></div>

      <!-- Birds -->
      <div class="login-birds" id="loginBirds"></div>

      <!-- Back mountains (SVG) -->
      <div class="login-mountains-back">
        <svg viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" width="100%" preserveAspectRatio="none">
          <defs>
            <linearGradient id="mtnBack" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#c0506a"/>
              <stop offset="100%" stop-color="#7b2d8b"/>
            </linearGradient>
          </defs>
          <polygon points="0,220 80,60 160,140 260,20 380,100 480,10 600,90 700,30 800,80 800,220" fill="url(#mtnBack)" opacity="0.7"/>
        </svg>
      </div>

      <!-- Front mountains (SVG) -->
      <div class="login-mountains-front">
        <svg viewBox="0 0 800 180" xmlns="http://www.w3.org/2000/svg" width="100%" preserveAspectRatio="none">
          <defs>
            <linearGradient id="mtnFront" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#3d1060"/>
              <stop offset="100%" stop-color="#1a0533"/>
            </linearGradient>
          </defs>
          <polygon points="0,180 100,80 200,130 320,40 440,110 560,50 680,100 800,60 800,180" fill="url(#mtnFront)"/>
        </svg>
      </div>

      <!-- Water -->
      <div class="login-water"></div>

      <!-- Ground -->
      <div class="login-ground" id="loginGround">
        <!-- Grass blades injected by JS -->
      </div>

      <!-- Traveller SVG silhouette -->
      <div class="login-traveller">
        <svg viewBox="0 0 60 90" xmlns="http://www.w3.org/2000/svg" width="60" height="90">
          <!-- Hat -->
          <ellipse cx="30" cy="18" rx="22" ry="7" fill="#1a0a00"/>
          <ellipse cx="30" cy="14" rx="10" ry="8" fill="#2a1200"/>
          <!-- Head -->
          <circle cx="30" cy="26" r="8" fill="#2a1200"/>
          <!-- Body -->
          <rect x="22" y="34" width="16" height="22" rx="4" fill="#1a0a00"/>
          <!-- Backpack -->
          <rect x="34" y="36" width="10" height="16" rx="3" fill="#3d1a00"/>
          <!-- Scarf -->
          <path d="M22 38 Q10 50 8 65" stroke="#c0392b" stroke-width="4" fill="none" stroke-linecap="round"/>
          <!-- Legs -->
          <rect x="23" y="56" width="6" height="20" rx="3" fill="#1a0a00"/>
          <rect x="31" y="56" width="6" height="20" rx="3" fill="#1a0a00"/>
          <!-- Staff -->
          <line x1="18" y1="34" x2="10" y2="80" stroke="#5a3010" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>

      <!-- Grass blades (JS generated) -->
      <div id="loginGrass" style="position:absolute;bottom:0;left:0;right:0;height:22%;pointer-events:none;"></div>

    </div>

    <!-- Scene overlay label -->
    <div class="scene-label">
      <div class="scene-label-icon">🏔️</div>
      <p>Every word is a new summit to climb</p>
    </div>
  </div>

  <!-- ── RIGHT PANEL: Auth Form ── -->
  <div class="auth-form-panel">
    <div class="auth-container">
      <div class="logo-wrap">
        <div class="logo-icon">🔤</div>
        <h1 class="logo-text">WordQuest</h1>
        <p class="logo-sub">Fill the missing letters. Beat the levels.</p>
      </div>

      <div class="tab-switch">
        <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">Login</button>
        <button class="tab-btn" id="registerTab" onclick="switchTab('register')">Register</button>
      </div>

      <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">
        <div class="input-group">
          <span class="input-icon">👤</span>
          <input type="text" id="loginUser" placeholder="Username" required autocomplete="username"/>
        </div>
        <div class="input-group">
          <span class="input-icon">🔒</span>
          <input type="password" id="loginPass" placeholder="Password" required autocomplete="current-password"/>
        </div>
        <button type="submit" class="btn-primary">
          <span>Login</span>
          <div class="btn-shine"></div>
        </button>
        <p class="auth-msg" id="loginMsg"></p>
      </form>

      <form id="registerForm" class="auth-form hidden" onsubmit="handleRegister(event)">
        <div class="input-group">
          <span class="input-icon">👤</span>
          <input type="text" id="regUser" placeholder="Choose a username" required autocomplete="username"/>
        </div>
        <div class="input-group">
          <span class="input-icon">🔒</span>
          <input type="password" id="regPass" placeholder="Create a password" required autocomplete="new-password"/>
        </div>
        <button type="submit" class="btn-primary">
          <span>Create Account</span>
          <div class="btn-shine"></div>
        </button>
        <p class="auth-msg" id="registerMsg"></p>
      </form>
    </div>

    <!-- Footer -->
    <footer class="auth-footer">
      Developed by <span class="footer-name">Yuvraj Singh Kaurav</span>
    </footer>

  </div><!-- end auth-form-panel -->

  <script src="js/auth.js"></script>
  <script src="js/scene-builder.js"></script>
  <script>buildLoginScene();</script>
</body>
</html>
